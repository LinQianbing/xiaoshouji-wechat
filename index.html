<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1faff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小手机" />
    <title>小手机 MVP</title>
    <link rel="manifest" href="manifest.webmanifest?v=10" />
    <link rel="apple-touch-icon" href="assets/pwa/icon-180.png?v=10" />
    <link rel="stylesheet" href="css/style.css?v=25" />
    <link rel="stylesheet" href="css/moments-wechat-fix.css?v=3" />
  </head>
  <body>
    <div class="desktop-bg">
      <main class="phone-frame" id="app">
        <!-- 聊天列表 -->
        <section class="screen active" id="screen-chats" data-tab="chats">
          <header class="wechat-bar">
            <button class="bar-btn invisible" type="button">返回</button>
            <h1>微信</h1>
            <button class="bar-icon plus-icon" id="topNewChatBtn" type="button" aria-label="发起聊天"></button>
          </header>
          <div class="search-row">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="chatSearch" type="search" placeholder="搜索联系人或聊天记录" />
          </div>
          <div class="list-page" id="chatList"></div>
        </section>

        <!-- 单聊详情：像微信一样进入后隐藏底部导航 -->
        <section class="screen chat-detail" id="screen-chat-detail">
          <header class="wechat-bar chat-top">
            <button class="bar-btn" id="backToChatsBtn" type="button">‹</button>
            <div class="chat-title-wrap">
              <h1 id="chatTitle">联系人</h1>
              <p id="chatSubtitle">在线 · 线上模式</p>
            </div>
            <button class="bar-icon" id="openChatMenuBtn" type="button" aria-label="聊天设置">⋯</button>
          </header>

          <div class="mode-line">
            <button class="mode-pill active" data-mode="online" type="button">线上</button>
            <button class="mode-pill" data-mode="offline" type="button">线下</button>
            <span id="nowLabel">--:--</span>
          </div>

          <div class="proactive-banner hidden" id="proactiveBanner">
            <span id="proactiveText">TA 好像有话想说</span>
            <button id="pullProactiveBtn" type="button">看看</button>
          </div>

          <div class="api-alert hidden" id="apiAlert">
            <span id="apiAlertText">还没有连接 API，当前不会生成真实回复。</span>
            <button id="goApiSettingsBtn" type="button">去配置</button>
          </div>

          <div class="messages" id="messageList"></div>

          <div class="attach-panel hidden" id="attachPanel">
            <button class="attach-action" id="attachImageBtn" type="button">
              <span class="attach-icon attach-image-icon" aria-hidden="true"></span>
              <em>图片</em>
            </button>
            <button class="attach-action" id="attachFileBtn" type="button">
              <span class="attach-icon attach-file-icon" aria-hidden="true"></span>
              <em>文件</em>
            </button>
            <button class="attach-action" id="regenerateBtn" type="button">
              <span class="attach-icon attach-regen-icon" aria-hidden="true"></span>
              <em>重生成</em>
            </button>
            <button class="attach-action" id="proactiveTalkBtn" type="button">
              <span class="attach-icon attach-talk-icon" aria-hidden="true"></span>
              <em>TA说话</em>
            </button>
            <button class="attach-action" id="patBtn" type="button">
              <span class="attach-icon attach-pat-icon" aria-hidden="true"></span>
              <em>我拍TA</em>
            </button>
            <button class="attach-action" id="rolePatBtn" type="button">
              <span class="attach-icon attach-pat-icon" aria-hidden="true"></span>
              <em>TA拍我</em>
            </button>
            <input id="imageAttachInput" type="file" accept="image/*" hidden />
            <input id="fileAttachInput" type="file" hidden />
          </div>

          <footer class="input-bar">
            <button class="round-tool input-plus" id="inputPlusBtn" type="button" aria-label="更多"></button>
            <textarea id="messageInput" rows="1" placeholder="发消息"></textarea>
            <button class="send-btn" id="sendBtn" type="button">发送</button>
          </footer>
        </section>

        <!-- 聊天信息 -->
        <section class="screen chat-info-screen" id="screen-chat-info">
          <header class="wechat-bar">
            <button class="bar-btn" id="backToChatInfoBtn" type="button">‹</button>
            <h1>聊天信息</h1>
            <button class="bar-btn invisible" type="button">返回</button>
          </header>
          <div class="chat-info-page">
            <section class="chat-info-profile" id="chatInfoProfile"></section>

            <section class="settings-group">
              <label class="switch-row">
                <span>置顶聊天</span>
                <input id="pinChatInput" type="checkbox" />
              </label>
              <label class="switch-row">
                <span>加入黑名单</span>
                <input id="blockChatInput" type="checkbox" />
              </label>
              <p class="setting-note">加入黑名单后，对方仍可发消息，但会知道自己被拉黑了；对方消息旁会显示红色感叹号。</p>
            </section>

            <section class="settings-group">
              <h2>聊天背景</h2>
              <button class="chat-bg-row" id="changeChatBgBtn" type="button">
                <span>设置当前聊天背景</span>
                <span class="chat-bg-meta">
                  <i class="chat-bg-preview" id="chatBgPreview" aria-hidden="true"></i>
                  <em id="chatBgStatus">默认</em>
                </span>
              </button>
              <button class="plain-row chat-bg-clear hidden" id="clearChatBgBtn" type="button">恢复默认背景</button>
              <input id="chatBgInput" type="file" accept="image/*" hidden />
              <p class="setting-note">只影响当前联系人，选中消息截图也会使用这个背景。</p>
            </section>

            <section class="settings-group">
              <h2>希望对方记住</h2>
              <div class="memory-editor">
                <textarea id="newMemoryInput" rows="3" placeholder="写一条希望对方长期记住的事"></textarea>
                <button id="addMemoryBtn" type="button">添加</button>
              </div>
              <div id="memoryEditList" class="memory-edit-list"></div>
            </section>

            <section class="settings-group">
              <button class="plain-row" id="infoEditRoleBtn" type="button">编辑联系人资料</button>
              <button class="plain-row" id="infoGenerateMemoryBtn" type="button">整理最近聊天为记忆</button>
              <button class="plain-row" id="infoGenerateMomentBtn" type="button">根据最近聊天发朋友圈</button>
            </section>
          </div>
        </section>

        <!-- 通讯录 -->
        <section class="screen" id="screen-contacts" data-tab="contacts">
          <header class="wechat-bar">
            <button class="bar-btn invisible" type="button">返回</button>
            <h1>通讯录</h1>
            <button class="bar-icon plus-icon" id="addRoleBtn" type="button" aria-label="添加联系人"></button>
          </header>
          <div class="list-page contacts-page">
            <div class="wechat-group-title">朋友</div>
            <div id="contactList" class="contact-list"></div>
          </div>
        </section>

        <!-- 朋友圈 -->
        <section class="screen" id="screen-moments" data-tab="moments">
          <header class="wechat-bar">
            <button class="bar-btn invisible" type="button">返回</button>
            <h1>朋友圈</h1>
            <button class="bar-icon camera-icon" id="generateMomentBtn" type="button" aria-label="发布朋友圈"></button>
          </header>
          <div class="moments-hero">
            <button class="cover-change-btn" id="changeMomentsCoverBtn" type="button">更换背景</button>
            <input id="momentsCoverInput" type="file" accept="image/*" hidden />
            <div class="moments-hero-profile">
              <strong id="momentsHeroName">我</strong>
              <p id="momentsHeroSignature"></p>
            </div>
            <img id="momentsUserAvatar" alt="用户头像" />
          </div>
          <div class="moments-list" id="momentsList"></div>
        </section>

        <!-- 我 / 设置 -->
        <section class="screen" id="screen-me" data-tab="me">
          <header class="wechat-bar">
            <button class="bar-btn invisible" type="button">返回</button>
            <h1>我</h1>
            <button class="bar-btn invisible" type="button">返回</button>
          </header>
          <div class="me-page">
            <section class="me-card">
              <label class="avatar-uploader">
                <img id="meAvatar" alt="用户头像" />
                <input id="userAvatarInput" type="file" accept="image/*" hidden />
              </label>
              <div>
                <input class="me-name-input" id="userNameInput" type="text" placeholder="你的昵称" />
              </div>
            </section>

            <details class="settings-group settings-panel">
              <summary>个人设定</summary>
              <label class="setting-area">
                <textarea id="userPersonaInput" rows="5" placeholder="写你的身份、关系、性格、说话习惯，角色会在回复时参考。"></textarea>
              </label>
            </details>

            <details class="settings-group settings-panel">
              <summary>AI 设置</summary>
              <label class="setting-row">
                <span>API Key</span>
                <input id="apiKeyInput" type="password" placeholder="只保存在本地" />
              </label>
              <label class="setting-row model-row">
                <span>模型</span>
                <div class="model-control">
                  <input id="modelInput" type="text" list="modelList" placeholder="例如 gpt-4o-mini" />
                  <datalist id="modelList"></datalist>
                  <button id="fetchModelsBtn" type="button">拉取</button>
                </div>
              </label>
              <p class="model-status" id="modelStatus"></p>
              <label class="setting-row">
                <span>接口地址</span>
                <input id="apiBaseInput" type="text" placeholder="OpenAI-compatible URL" />
              </label>
            </details>

            <details class="settings-group settings-panel">
              <summary>聊天体验</summary>
              <label class="setting-row">
                <span>默认模式</span>
                <select id="defaultModeSelect">
                  <option value="online">线上</option>
                  <option value="offline">线下</option>
                </select>
              </label>
              <label class="setting-range">
                <span>话唠程度 <b id="talkLevelText">Lv5</b></span>
                <input id="talkLevelInput" type="range" min="1" max="10" step="1" />
              </label>
              <label class="setting-row">
                <span>个性签名</span>
                <input id="profileSignatureInput" type="text" maxlength="40" placeholder="展示在朋友圈封面" />
              </label>
              <label class="setting-row">
                <span>我的拍一拍</span>
                <input id="userPatSuffixInput" type="text" maxlength="24" placeholder="例如：的肩膀" />
              </label>
              <label class="switch-row">
                <span>允许主动消息</span>
                <input id="allowProactiveInput" type="checkbox" />
              </label>
              <label class="switch-row">
                <span>允许长期记忆</span>
                <input id="allowMemoryInput" type="checkbox" />
              </label>
              <label class="switch-row">
                <span>允许朋友圈生成</span>
                <input id="allowMomentsInput" type="checkbox" />
              </label>
            </details>

            <details class="settings-group settings-panel danger-zone">
              <summary>数据与备份</summary>
              <button class="plain-row" id="exportDataBtn" type="button">导出数据</button>
              <label class="plain-row file-row">
                导入数据
                <input id="importDataInput" type="file" accept="application/json" hidden />
              </label>
              <button class="plain-row" id="clearChatBtn" type="button">清空当前联系人聊天记录</button>
              <button class="plain-row" id="clearMemoryBtn" type="button">清空当前联系人记忆</button>
            </details>

            <details class="settings-group settings-panel about-card">
              <summary>关于小手机</summary>
              <button class="plain-row" id="installPwaBtn" type="button">安装到桌面</button>
              <p>这是一个本地网页 App。联系人、聊天、朋友圈和记忆都保存在浏览器 localStorage 里，不上传用户数据。</p>
            </details>
          </div>
        </section>

        <nav class="tabbar" id="tabbar">
          <button class="tab active" data-tab-target="chats" type="button"><i class="tab-icon tab-chat" aria-hidden="true"></i><em>微信</em></button>
          <button class="tab" data-tab-target="contacts" type="button"><i class="tab-icon tab-contacts" aria-hidden="true"></i><em>通讯录</em></button>
          <button class="tab" data-tab-target="moments" type="button"><i class="tab-icon tab-moments" aria-hidden="true"></i><em>发现</em></button>
          <button class="tab" data-tab-target="me" type="button"><i class="tab-icon tab-me" aria-hidden="true"></i><em>我</em></button>
        </nav>
      </main>
    </div>

    <!-- 联系人编辑弹层 -->
    <dialog class="sheet-dialog" id="roleDialog">
      <form method="dialog" class="role-sheet" id="roleForm">
        <header>
          <button value="cancel" type="button" id="closeRoleDialogBtn">取消</button>
          <strong id="roleDialogTitle">添加联系人</strong>
          <button value="default" type="submit">保存</button>
        </header>
        <div class="role-edit-body">
          <label class="role-avatar-picker">
            <img id="roleAvatarPreview" alt="联系人头像" />
            <input id="roleAvatarInput" type="file" accept="image/*" hidden />
            <span>点击换头像</span>
          </label>
          <label>
            <span>名字</span>
            <input id="roleNameInput" type="text" placeholder="例如：小手机" required />
          </label>
          <label>
            <span>性别</span>
            <select id="roleGenderInput">
              <option value="未设定">未设定</option>
              <option value="女">女</option>
              <option value="男">男</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <label>
            <span>资料备注</span>
            <textarea id="roleDescInput" rows="8" placeholder="写性格、关系、说话习惯、背景、喜欢或讨厌什么。"></textarea>
          </label>
          <label>
            <span>拍一拍后缀</span>
            <input id="rolePatSuffixInput" type="text" maxlength="24" placeholder="例如：的脑袋" />
          </label>
          <button class="delete-role-btn hidden" id="deleteRoleBtn" type="button">删除联系人</button>
        </div>
      </form>
    </dialog>

    <!-- 发起聊天弹层 -->
    <dialog class="sheet-dialog" id="newChatDialog">
      <div class="new-chat-sheet">
        <header>
          <button type="button" id="closeNewChatBtn">取消</button>
          <strong>发起聊天</strong>
          <button type="button" id="newContactFromChatBtn">添加</button>
        </header>
        <div class="new-chat-list" id="newChatList"></div>
      </div>
    </dialog>

    <!-- 联系人详情弹层 -->
    <dialog class="sheet-dialog" id="profileDialog">
      <div class="profile-sheet">
        <button class="sheet-close" id="closeProfileBtn" type="button">×</button>
        <img id="profileAvatar" alt="联系人头像" />
        <h2 id="profileName">联系人</h2>
        <p id="profileMeta">性别</p>
        <p id="profileDesc"></p>
        <div class="profile-actions">
          <button id="profileChatBtn" type="button">发消息</button>
          <button id="profileEditBtn" type="button">编辑资料</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast"></div>

    <script type="module" src="js/main.js?v=33"></script>
    <script>
      if ("serviceWorker" in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("service-worker.js")
            .then((registration) => {
              const activateUpdate = () => {
                const worker = registration.waiting || registration.installing;
                if (worker && navigator.serviceWorker.controller) worker.postMessage({ type: "SKIP_WAITING" });
              };
              registration.addEventListener("updatefound", () => {
                const worker = registration.installing;
                if (!worker) return;
                worker.addEventListener("statechange", () => {
                  if (worker.state === "installed") activateUpdate();
                });
              });
              activateUpdate();
              registration.update().catch(() => {});
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
